version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: sih_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_pass
      POSTGRES_DB: crypto_fraud_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_user -d crypto_fraud_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: sih_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sih_user:sih_pass@db:5432/crypto_fraud_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
